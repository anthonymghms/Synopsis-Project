# Initial HTTP configuration. Add HTTPS before using real accounts or imports.
# Install in /etc/nginx/sites-available/paragospels and enable via sites-enabled.
server {
    listen 80;
    listen [::]:80;
    server_name paragospels.com www.paragospels.com 144.202.29.152;

    root /var/www/paragospels;
    index index.html;
    server_tokens off;

    # Flask enforces the actual 32 MiB request-body cap. The larger edge cap lets
    # modestly oversized requests receive Flask's structured JSON error.
    client_max_body_size 34m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    # Flutter's filenames are not consistently content-hashed. Revalidate them
    # on each visit instead of retaining an old shell or main.dart.js for weeks.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        # The trailing slash strips /api/: /api/topics reaches Flask /topics.
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
        proxy_cache off;

        # These API responses depend on authentication/membership. Do not let
        # intermediaries retain them even if an endpoint marks its result public.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Retain the webroot challenge path when adding HTTPS later.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    # Defense in depth: these files must never be copied into the webroot.
    location ~* /(?:serviceAccountKey|firebase-service-account)\.json$ {
        return 404;
    }

    # A missing generated asset must be a 404, not an HTML SPA response.
    location ~* \.(?:js|mjs|wasm|json|css|map|png|jpg|jpeg|gif|webp|svg|ico|ttf|otf|woff|woff2)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
